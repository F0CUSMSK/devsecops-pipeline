name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - vulnerable
  pull_request:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Checkov scans Terraform files
  # ─────────────────────────────────────────────
  checkov-scan:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout my code
        uses: actions/checkout@v4

      - name: create reports directory
        run: mkdir -p reports

      - name: run checkov scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli,json,junit
          output_file_path: reports/
          soft_fail: true

      - name: debug show report files
        run: ls -la reports/
        if: always()

      - name: fail if checkov found issues
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          print('Files in reports:', os.listdir('reports'))
          try:
              data = json.load(open('reports/results_json.json'))
              failed = data['results']['failed_checks']
              print(f'Checkov found {len(failed)} issues')
              if len(failed) > 0:
                  sys.exit(1)
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(1)
          PY

      - name: upload checkov report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: reports/

  # ─────────────────────────────────────────────
  # JOB 2 — Tfsec scans Terraform files
  # ─────────────────────────────────────────────
  tfsec-scan:
    name: Tfsec Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout my code
        uses: actions/checkout@v4

      - name: create reports directory
        run: mkdir -p reports

      - name: install tfsec
        run: |
          wget -q https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 -O tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec

      - name: run tfsec scanner save JSON report
        run: tfsec . --format json --out reports/tfsec-report.json || true

      - name: run tfsec scanner fail build on findings
        run: tfsec . --format default

      - name: upload tfsec report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec-report
          path: reports/tfsec-report.json

  # ─────────────────────────────────────────────
  # JOB 3 — Gitleaks scans for secrets
  # ─────────────────────────────────────────────
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout my code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: create reports directory
        run: mkdir -p reports

      - name: install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: run gitleaks scanner save JSON report
        run: gitleaks detect --source . -v --report-format json --report-path reports/gitleaks-report.json || true

      - name: run gitleaks scanner fail build on findings
        run: gitleaks detect --source . -v

      - name: upload gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json

  # ─────────────────────────────────────────────
  # JOB 4 — Ansible-Lint scans playbooks
  # ─────────────────────────────────────────────
  ansible-lint:
    name: Ansible-Lint Scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout my code
        uses: actions/checkout@v4

      - name: create reports directory
        run: mkdir -p reports

      - name: install ansible-lint
        run: |
          pip install ansible-lint
          pip install ansible

      - name: run ansible-lint scanner save JSON report
        run: ansible-lint ansible/playbook.yml --format json -q > reports/ansible-lint-report.json || true

      - name: run ansible-lint scanner fail build on findings
        run: ansible-lint ansible/playbook.yml -v

      - name: upload ansible-lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansible-lint-report
          path: reports/ansible-lint-report.json

  # ─────────────────────────────────────────────
  # JOB 5 — Generate HTML Dashboard
  # ─────────────────────────────────────────────
  generate-dashboard:
    name: Generate Security Dashboard
    runs-on: ubuntu-latest
    needs: [checkov-scan, tfsec-scan, gitleaks-scan, ansible-lint]
    if: always()

    steps:
      - name: checkout my code
        uses: actions/checkout@v4

      - name: create reports directory
        run: mkdir -p reports

      - name: download checkov report
        uses: actions/download-artifact@v4
        with:
          name: checkov-report
          path: reports/checkov/
        continue-on-error: true

      - name: download tfsec report
        uses: actions/download-artifact@v4
        with:
          name: tfsec-report
          path: reports/tfsec/
        continue-on-error: true

      - name: download gitleaks report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks/
        continue-on-error: true

      - name: download ansible-lint report
        uses: actions/download-artifact@v4
        with:
          name: ansible-lint-report
          path: reports/ansible/
        continue-on-error: true

      - name: generate HTML dashboard
        run: python3 .github/scripts/generate_dashboard.py

      - name: upload dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-dashboard
          path: reports/dashboard.html
