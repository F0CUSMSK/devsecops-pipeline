
[webservers]
# BAD PRACTICE: hardcoded ip with plaintext credentials
# gitleaks will catch the password here
192.168.1.100 ansible_user=adminuser ansible_password=SuperSecret123! ansible_port=22

[webservers:vars]
# BAD PRACTICE: storing credentials as variables in inventory
# should be in ansible vault or hashicorp vault instead
ansible_become=yes
ansible_become_method=sudo
ansible_become_pass=SuperSecret123!

[dbservers]
# another server with same bad practice
192.168.1.101 ansible_user=adminuser ansible_password=DatabasePass123! ansible_port=22

[all:vars]
# BAD PRACTICE: private key path hardcoded
# and ssh host key checking disabled which is dangerous
ansible_ssh_private_key_file=/home/adminuser/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'