- name: Deploy and configure web server
  hosts: webservers
  become: true
  become_method: ansible.builtin.sudo

  vars:

    db_user: "{{ lookup('env', 'DB_USER') }}"
    app_port: 80

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Install mysql
      ansible.builtin.apt:
        name: mysql-server
        state: present

    - name: Configure database user
      ansible.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ lookup('env', 'DB_PASSWORD') }}"
        host: localhost
        state: present

    - name: Create app config file
      ansible.builtin.copy:
        content: |
          DB_USER={{ db_user }}
          PORT={{ app_port }}
        dest: /etc/app/config.env

        mode: "0640"
        owner: root
        group: root

    - name: Start nginx service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Install python packages
      ansible.builtin.pip:
        name: flask==3.0.0

    - name: Create app directory
      ansible.builtin.file:
        path: /var/www/myapp
        state: directory
        mode: "0750"
        owner: root
        group: www-data

    - name: Check app status
      ansible.builtin.service_facts:

    - name: Show app status
      ansible.builtin.debug:
        msg: "myapp is {{ ansible_facts.services['myapp.service'].status | default('not installed') }}"
